databases:
  - name: habotconnect-db
    plan: free

services:
  - type: web
    name: habotconnect-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn habotconnect.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: habotconnect-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
